dependencies { implementation project(':common') }
jar { archiveBaseName='echograve-neoforge'; manifest { attributes 'Implementation-Title':'EchoGrave NeoForge', 'Minecraft-Version':rootProject.ext.targetMinecraftVersion } }
rootProject.ext.supportedMinecraftVersions.each { v -> tasks.register("jarMc${v.replace('.','_')}", Jar) { duplicatesStrategy = DuplicatesStrategy.EXCLUDE; dependsOn classes, ':common:classes'; archiveBaseName="echograve-neoforge"; archiveVersion="${project.version.toString().replace(rootProject.ext.targetMinecraftVersion,v)}"; destinationDirectory=file("${rootProject.projectDir}/build-output"); from sourceSets.main.output; from(project(':common').sourceSets.main.output); from('src/main/resources') { expand minecraft_version:v, mod_version:rootProject.version.toString().replace(rootProject.ext.targetMinecraftVersion,v) }; manifest { attributes 'Implementation-Title':'EchoGrave NeoForge', 'Minecraft-Version':v } } }
